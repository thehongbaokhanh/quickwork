name: quickwork

services:
  nginx:
    image: nginx:1.30.4-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./deploy/nginx/quickwork.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Set NUXT_PUBLIC_API_BASE in .env.production}
      NUXT_API_BASE_INTERNAL: ${NUXT_API_BASE_INTERNAL:-http://backend:8080/api/v1}
      NUXT_API_PROXY_TARGET: ${NUXT_API_PROXY_TARGET:-http://backend:8080}
      NUXT_PUBLIC_GEOCODING_BASE_URL: ${NUXT_PUBLIC_GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      APP_NAME: ${APP_NAME:-QuickWork}
      APP_PORT: "8080"
      APP_ENV: production
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET in .env.production}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env.production}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      DB_SEED_ENABLED: ${DB_SEED_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      JWT_REFRESH_EXPIRY_HOURS: ${JWT_REFRESH_EXPIRY_HOURS:-720}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_EXPOSE_TOKENS: ${AUTH_EXPOSE_TOKENS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      UPLOAD_DIR: /app/uploads
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      UPLOAD_MALWARE_SCAN_REQUIRED: ${UPLOAD_MALWARE_SCAN_REQUIRED:-false}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      JOB_MATCH_CANDIDATE_LIMIT: ${JOB_MATCH_CANDIDATE_LIMIT:-20}
      JOB_MATCH_CACHE_TTL_MINUTES: ${JOB_MATCH_CACHE_TTL_MINUTES:-45}
      JOB_MATCH_AI_TIMEOUT_SECONDS: ${JOB_MATCH_AI_TIMEOUT_SECONDS:-12}
      MQ_ENABLED: ${MQ_ENABLED:-true}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env.production}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-quickwork.events}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-quickwork.notifications}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-notification.create}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-20}
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/jobs || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env.production}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.production}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.2.7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env.production}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  edge:
  data:
    internal: true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
