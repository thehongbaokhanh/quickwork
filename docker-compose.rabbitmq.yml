services:
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: quickwork-rabbitmq
    hostname: quickwork-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-quickwork}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-quickwork_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - quickwork-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  quickwork-rabbitmq-data:
