# QuickWork free demo Blueprint.
# One Docker web service runs both Nuxt and Go. TiDB Cloud supplies the
# external MySQL-compatible database; Render Key Value supplies ephemeral
# Redis-compatible storage. See DEPLOYMENT.md before applying this Blueprint.
services:
  - type: web
    name: quickwork-free
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.render-free
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "8080"
      - key: APP_NAME
        value: QuickWork
      - key: APP_ENV
        value: demo
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_IP_ALLOWLIST
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: JWT_REFRESH_EXPIRY_HOURS
        value: "720"
      - key: DB_SEED_ENABLED
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_EXPOSE_TOKENS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: quickwork-free
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_TLS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: quickwork-redis-free
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: UPLOAD_MALWARE_SCAN_REQUIRED
        value: "false"
      - key: MQ_ENABLED
        value: "false"
      - key: NUXT_PUBLIC_API_BASE
        value: /api/v1
      - key: NUXT_API_BASE_INTERNAL
        value: http://127.0.0.1:8080/api/v1
      - key: NUXT_API_PROXY_TARGET
        value: http://127.0.0.1:8080
      - key: NUXT_PUBLIC_GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: JOB_MATCH_CANDIDATE_LIMIT
        value: "20"
      - key: JOB_MATCH_CACHE_TTL_MINUTES
        value: "45"
      - key: JOB_MATCH_AI_TIMEOUT_SECONDS
        value: "12"

  - type: keyvalue
    name: quickwork-redis-free
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
