# Development/demo-only overlay for a zero-configuration Cloudflare Quick Tunnel.
# Run it together with compose.yaml and compose.override.yaml.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --url
      - http://nginx:80
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
